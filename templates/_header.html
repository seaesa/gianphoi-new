<header class="site-header">
  <div class="container header__inner">
    <a class="brand" href="/index.html">
      <img src="/assets/images/logo-hoa-phat.png" alt="{{ business_name }} — lắp đặt giàn phơi Hòa Phát chính hãng" width="40" height="40">
      <span>Giàn Phơi Thông Minh<small>Bình Dương &amp; TP.HCM</small></span>
    </a>

    <nav class="nav" aria-label="Điều hướng chính">
{{{ nav_list }}}
    </nav>

    <div class="header__actions">
      <a class="header__phone" href="tel:{{ phone }}" data-action="call">
        {{{ icon_phone }}}
        <span class="header__phone-number">{{ phone_display }}</span>
      </a>
      <a class="btn btn--primary" href="/lien-he.html">Nhận báo giá</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-list" aria-label="Mở menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
